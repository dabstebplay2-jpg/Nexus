name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pip-audit
        run: pip-audit -r requirements.txt

      - name: pytest
        env:
          NEXUS_CLOUD_SECRET_KEY: test-secret-key-32-characters-long!!
          NEXUS_CLOUD_DATABASE_URL: sqlite:///:memory:
        run: pytest -q
